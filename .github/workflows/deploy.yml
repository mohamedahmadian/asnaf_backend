name: Deploy Qeshm Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            echo "🚀 Starting Qeshm Backend deployment..."

            cd /var/www/backend

            echo "📌 Current commit:"
            OLD_COMMIT=$(git rev-parse HEAD)
            echo "$OLD_COMMIT"

            echo "📥 Fetching latest code..."
            git fetch origin main

            echo "🔄 Resetting to origin/main..."
            git reset --hard origin/main
            git clean -fd

            NEW_COMMIT=$(git rev-parse HEAD)

            echo "📌 New commit:"
            echo "$NEW_COMMIT"

            if [ "$OLD_COMMIT" = "$NEW_COMMIT" ]; then
              echo "ℹ️ No new commits. Continuing deployment..."
            fi

            echo "🔍 Checking dependency changes..."

            if git diff --name-only "$OLD_COMMIT" "$NEW_COMMIT" | grep -qE '^(package.json|package-lock.json)$'; then
              echo "📦 Dependencies changed. Running npm ci..."
              npm ci
            else
              echo "✅ Dependencies unchanged. Skipping npm ci."
            fi

            echo "🗄️ Applying database migrations..."
            npx prisma migrate deploy

            echo "🔧 Generating Prisma Client..."
            npx prisma generate

            echo "🌱 Running seed..."
            npm run prisma:seed

            echo "♻️ Restarting Qeshm Backend..."
            pm2 restart qeshm-backend

            echo "📊 PM2 status:"
            pm2 status qeshm-backend

            echo "✅ Qeshm Backend deployment completed successfully!"
